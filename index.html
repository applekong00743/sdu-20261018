<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Pages 배포 테스트</title>
  <style>
    body {
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 480px;
      width: 90%;
    }
    h1 {
      color: #2da44e;
      margin-bottom: 10px;
      font-size: 24px;
    }
    p {
      color: #57606a;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .info-box {
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      padding: 15px;
      text-align: left;
      font-size: 14px;
      color: #24292f;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background-color: #0969da;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #0550ae;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>서울디지털대학교 - 바이브코딩(6주차)</h1>
    <p>이 화면이 보인다면 GitHub Pages 웹 호스팅이 정상적으로 작동하고 있는 것입니다.</p>
    <div class="info-box">
      <strong>• 5주차 1교시(GitHub Pages 배포하기):</strong> 최종 결과를 GitHub Pages에 배포한 ①링크가 연결되는 URL 작성, ②웹 브라우저 스크린샷<br>
      <strong>• 6주차 2교시(QRnShort 만들기):</strong> 5주차 2교시(URL2QR 웹사이트 만들기)와 연결된 최종 결과를 GitHub Pages에 배포한 <br>①링크가 연결되는 URL 작성, ②웹 브라우저 스크린샷
    </div>
    <a href="./qrnshort.html" class="btn">QRnShort 페이지로 이동 (연결 테스트용)</a>
  </div>
</body>
</html>
