  <title>QRnShort - URL 변환기 (5주차·6주차 연동)</title>
  <script>
    // 비상용 자체 단축 링크 접속 시 원본 URL로 즉시 이동 처리
    (function() {
      const params = new URLSearchParams(window.location.search);
      const redirectCode = params.get('go');
      if (redirectCode) {
        try {
          const decodedUrl = decodeURIComponent(escape(atob(redirectCode)));
          window.location.replace(decodedUrl);
        } catch (e) {}
      }
    })();
  </script>
