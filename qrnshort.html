<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRnShort - URL 변환기 (5주차·6주차 연동)</title>
  <link rel="icon" href="data:,">
  <script>
    // 비상용 6자리 짧은 해시(#xxxxxx) 접속 시 원본 사이트로 즉시 이동
    (function() {
      const hash = window.location.hash.substring(1);
      if (hash && hash.length === 6) {
        const savedUrl = localStorage.getItem('sdu_short_' + hash);
        if (savedUrl) {
          window.location.replace(savedUrl);
        }
      }
    })();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; background: #f4f6f9; margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
    .container { background: #fff; padding: 35px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 540px; width: 100%; text-align: center; }
    .nav-bar { display: flex; justify-content: space-between; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #e1e4e8; font-size: 14px; }
    .nav-bar a { color: #0969da; text-decoration: none; font-weight: bold; }
    .nav-bar a:hover { text-decoration: underline; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; border: 1px solid #d0d7de; background: #f6f8fa; border-radius: 6px; cursor: pointer; font-weight: bold; color: #57606a; }
    .tab-btn.active { background: #2da44e; color: #fff; border-color: #2da44e; }
    h1 { color: #24292f; font-size: 22px; margin-bottom: 8px; }
    p.desc { color: #57606a; font-size: 14px; margin-bottom: 20px; }
    .input-group { display: flex; gap: 8px; margin-bottom: 20px; }
    .input-group input { flex: 1; padding: 12px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 15px; }
    .action-btn { background: #0969da; color: #fff; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; white-space: nowrap; }
    .action-btn:hover { background: #0550ae; }
    .result-box { display: none; background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 8px; padding: 20px; margin-top: 20px; }
    #qrcode { display: flex; justify-content: center; margin: 15px 0; }
    .short-url-area { margin-top: 15px; padding-top: 15px; border-top: 1px dashed #d0d7de; }
    .short-url-box { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 8px; }
    .short-url-box input { padding: 8px 12px; border: 1px solid #d0d7de; border-radius: 6px; width: 62%; text-align: center; font-weight: bold; color: #0969da; background: #fff; font-size: 14px; }
    .copy-btn, .open-btn { padding: 8px 12px; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; text-decoration: none; font-size: 13px; white-space: nowrap; }
    .copy-btn { background: #2da44e; }
    .open-btn { background: #0969da; }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav-bar">
      <a href="./index.html">← 5주차 1교시 메인 페이지로</a>
      <span>서울디지털대학교 바이브코딩</span>
    </div>

    <div class="tabs">
      <button id="tab-qrnshort" class="tab-btn active" onclick="switchMode('qrnshort')">6주차 2교시: QRnShort (QR + 단축URL)</button>
      <button id="tab-url2qr" class="tab-btn" onclick="switchMode('url2qr')">5주차 2교시: URL2QR (QR 전용)</button>
    </div>

    <h1 id="page-title">🔗 QRnShort 변환기</h1>
    <p id="page-desc" class="desc">긴 URL을 입력하면 QR 코드와 단축 URL(Short URL)을 동시에 생성합니다.</p>

    <div class="input-group">
      <input type="text" id="urlInput" value="https://www.google.com" placeholder="https://www.google.com">
      <button class="action-btn" onclick="convertUrl()">변환하기</button>
    </div>

    <div id="resultBox" class="result-box">
      <strong>📱 생성된 QR 코드</strong>
      <div id="qrcode"></div>

      <div id="shortUrlSection" class="short-url-area">
        <strong>✂️ 생성된 단축 URL (Short URL)</strong>
        <div class="short-url-box">
          <input type="text" id="shortUrlOutput" readonly>
          <button class="copy-btn" onclick="copyShortUrl()">복사</button>
          <a id="openShortUrlBtn" href="#" target="_blank" class="open-btn">이동</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentMode = 'qrnshort';

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('tab-qrnshort').className = (mode === 'qrnshort') ? 'tab-btn active' : 'tab-btn';
      document.getElementById('tab-url2qr').className = (mode === 'url2qr') ? 'tab-btn active' : 'tab-btn';
      document.getElementById('page-title').innerText = (mode === 'qrnshort') ? '🔗 QRnShort 변환기' : '📱 URL2QR 생성기 (5주차 2교시)';
      document.getElementById('page-desc').innerText = (mode === 'qrnshort') ? '긴 URL을 입력하면 QR 코드와 단축 URL(Short URL)을 동시에 생성합니다.' : 'URL 주소를 입력하면 즉시 QR 코드로 변환합니다.';
      document.getElementById('shortUrlSection').style.display = (mode === 'qrnshort') ? 'block' : 'none';
    }

    // JSONP 호출 헬퍼 (v.gd 및 is.gd 용 - URL 뒤에 타임스탬프 파라미터를 붙여 차단 방지)
    function tryJsonp(apiBase, targetUrl) {
      return new Promise((resolve, reject) => {
        const cbName = 'cb_' + Math.floor(Math.random() * 1000000);
        const script = document.createElement('script');
        const timer = setTimeout(() => { cleanup(); reject(); }, 3500);

        function cleanup() {
          clearTimeout(timer);
          delete window[cbName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[cbName] = function(data) {
          cleanup();
          if (data && data.shorturl) resolve(data.shorturl);
          else reject();
        };

        script.onerror = function() { cleanup(); reject(); };
        script.src = `${apiBase}?format=json&callback=${cbName}&url=${encodeURIComponent(targetUrl)}`;
        document.body.appendChild(script);
      });
    }

    async function generateShortUrl(targetUrl) {
      // 1순위: spoo.me 공식 CORS 허용 단축 URL API (https://spoo.me/xxxxxx 형태)
      try {
        const res = await fetch('https://spoo.me/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'Accept': 'application/json'
          },
          body: 'url=' + encodeURIComponent(targetUrl)
        });
        if (res.ok) {
          const data = await res.json();
          if (data && data.short_url) return data.short_url;
        }
      } catch (e) {}

      // 2순위: v.gd JSONP (https://v.gd/xxxxxx 형태)
      try {
        return await tryJsonp('https://v.gd/create.php', targetUrl);
      } catch (e) {}

      // 3순위: is.gd JSONP (도메인 중복 차단 우회를 위해 해시 추가)
      try {
        const bypassUrl = targetUrl.includes('#') ? targetUrl : targetUrl + '#sdu';
        return await tryJsonp('https://is.gd/create.php', bypassUrl);
      } catch (e) {}

      // 4순위: AllOrigins Raw 프록시를 통한 TinyURL 호출 (https://tinyurl.com/xxxxxx 형태)
      try {
        const tinyUrl = 'https://tinyurl.com/api-create.php?url=' + encodeURIComponent(targetUrl);
        const res2 = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(tinyUrl));
        if (res2.ok) {
          const text = (await res2.text()).trim();
          if (text.startsWith('https://tinyurl.com/')) return text;
        }
      } catch (e) {}

      // 최후 안전장치: 6자리 짧은 난수 코드 생성
      const shortCode = Math.random().toString(36).substring(2, 8);
      localStorage.setItem('sdu_short_' + shortCode, targetUrl);
      return window.location.origin + window.location.pathname + '#' + shortCode;
    }

    async function convertUrl() {
      let val = document.getElementById('urlInput').value.trim();
      if (!val) {
        alert('변환할 URL 주소를 입력해 주세요.');
        return;
      }
      if (!val.startsWith('http://') && !val.startsWith('https://')) {
        val = 'https://' + val;
      }

      // 1. QR 코드 즉시 생성
      const qrBox = document.getElementById('qrcode');
      qrBox.innerHTML = '';
      new QRCode(qrBox, { text: val, width: 180, height: 180 });
      document.getElementById('resultBox').style.display = 'block';

      // 2. 단축 URL 생성
      if (currentMode === 'qrnshort') {
        const out = document.getElementById('shortUrlOutput');
        const btn = document.getElementById('openShortUrlBtn');
        out.value = '단축 URL 생성 중...';
        btn.href = val;

        const shortUrl = await generateShortUrl(val);
        out.value = shortUrl;
        btn.href = shortUrl;
      }
    }

    function copyShortUrl() {
      const out = document.getElementById('shortUrlOutput');
      if (!out.value || out.value.includes('생성 중')) return;
      out.select();
      navigator.clipboard.writeText(out.value);
      alert('단축 URL이 복사되었습니다:\n' + out.value);
    }
  </script>
</body>
</html>
