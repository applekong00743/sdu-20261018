<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRnShort - URL 변환기 (5주차·6주차 연동)</title>
  <script>
    // 비상용 자체 단축 링크 접속 시 원본 URL로 즉시 이동 처리
    (function() {
      const params = new URLSearchParams(window.location.search);
      const redirectCode = params.get('go');
      if (redirectCode) {
        try {
          const decodedUrl = decodeURIComponent(escape(atob(redirectCode)));
          window.location.replace(decodedUrl);
        } catch (e) {}
      }
    })();
  </script>
  <!-- QR코드 생성 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body {
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: #ffffff;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      max-width: 540px;
      width: 100%;
      text-align: center;
    }
    .nav-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #e1e4e8;
      font-size: 14px;
    }
    .nav-bar a {
      color: #0969da;
      text-decoration: none;
      font-weight: bold;
    }
    .nav-bar a:hover {
      text-decoration: underline;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid #d0d7de;
      background: #f6f8fa;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      color: #57606a;
    }
    .tab-btn.active {
      background: #2da44e;
      color: #ffffff;
      border-color: #2da44e;
    }
    h1 {
      color: #24292f;
      font-size: 22px;
      margin-bottom: 8px;
    }
    p.desc {
      color: #57606a;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    input[type="url"] {
      flex: 1;
      padding: 12px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 15px;
    }
    button.action-btn {
      background-color: #0969da;
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      white-space: nowrap;
    }
    button.action-btn:hover {
      background-color: #0550ae;
    }
    .result-box {
      display: none;
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
    }
    #qrcode {
      display: flex;
      justify-content: center;
      margin: 15px 0;
    }
    .short-url-area {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px dashed #d0d7de;
    }
    .short-url-box {
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      margin-top: 8px;
    }
    .short-url-box input {
      padding: 8px 12px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      width: 60%;
      text-align: center;
      font-weight: bold;
      color: #0969da;
      background: #fff;
    }
    .copy-btn, .open-btn {
      padding: 8px 12px;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
      font-size: 13px;
    }
    .copy-btn {
      background: #2da44e;
    }
    .open-btn {
      background: #0969da;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav-bar">
      <a href="./index.html">← 5주차 1교시 메인 페이지로</a>
      <span>서울디지털대학교 바이브코딩</span>
    </div>

    <!-- 5주차 2교시(URL2QR) 및 6주차 2교시(QRnShort) 전환 탭 -->
    <div class="tabs">
      <button id="tab-qrnshort" class="tab-btn active" onclick="switchMode('qrnshort')">
        6주차 2교시: QRnShort (QR + 단축URL)
      </button>
      <button id="tab-url2qr" class="tab-btn" onclick="switchMode('url2qr')">
        5주차 2교시: URL2QR (QR 전용)
      </button>
    </div>

    <h1 id="page-title">🔗 QRnShort 변환기</h1>
    <p id="page-desc" class="desc">긴 URL을 입력하면 QR 코드와 단축 URL(Short URL)을 동시에 생성합니다.</p>

    <div class="input-group">
      <input type="url" id="urlInput" placeholder="https://www.sdu.ac.kr" required>
      <button class="action-btn" onclick="convertUrl()">변환하기</button>
    </div>

    <div id="resultBox" class="result-box">
      <strong>📱 생성된 QR 코드</strong>
      <div id="qrcode"></div>

      <div id="shortUrlSection" class="short-url-area">
        <strong>✂️ 생성된 단축 URL (Short URL)</strong>
        <div class="short-url-box">
          <input type="text" id="shortUrlOutput" readonly>
          <button class="copy-btn" onclick="copyShortUrl()">복사</button>
          <a id="openShortUrlBtn" href="#" target="_blank" class="open-btn">이동</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentMode = 'qrnshort';

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('tab-qrnshort').classList.toggle('active', mode === 'qrnshort');
      document.getElementById('tab-url2qr').classList.toggle('active', mode === 'url2qr');

      if (mode === 'qrnshort') {
        document.getElementById('page-title').innerText = '🔗 QRnShort 변환기';
        document.getElementById('page-desc').innerText = '긴 URL을 입력하면 QR 코드와 단축 URL(Short URL)을 동시에 생성합니다.';
        document.getElementById('shortUrlSection').style.display = 'block';
      } else {
        document.getElementById('page-title').innerText = '📱 URL2QR 생성기 (5주차 2교시)';
        document.getElementById('page-desc').innerText = 'URL 주소를 입력하면 즉시 QR 코드로 변환합니다.';
        document.getElementById('shortUrlSection').style.display = 'none';
      }
    }

    // CORS 차단을 우회하는 JSONP 단축 URL 요청 함수
    function shortenWithJsonp(apiBase, targetUrl) {
      return new Promise((resolve, reject) => {
        const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random());
        const script = document.createElement('script');
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error('Timeout'));
        }, 5000);

        function cleanup() {
          clearTimeout(timer);
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[callbackName] = function(data) {
          cleanup();
          if (data && data.shorturl) {
            resolve(data.shorturl);
          } else {
            reject(new Error('API Error'));
          }
        };

        script.onerror = function() {
          cleanup();
          reject(new Error('Script Load Error'));
        };

        script.src = `${apiBase}?format=json&callback=${callbackName}&url=${encodeURIComponent(targetUrl)}`;
        document.body.appendChild(script);
      });
    }

    async function convertUrl() {
      const urlInput = document.getElementById('urlInput').value.trim();
      if (!urlInput) {
        alert('변환할 URL 주소를 입력해 주세요!');
        return;
      }

      const targetUrl = urlInput.startsWith('http') ? urlInput : 'https://' + urlInput;

      // 1. QR 코드 생성
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';
      new QRCode(qrContainer, {
        text: targetUrl,
        width: 180,
        height: 180
      });

      document.getElementById('resultBox').style.display = 'block';

      // 2. 실제 작동하는 단축 URL 생성 (is.gd JSONP -> v.gd JSONP -> 자체 리다이렉트 순)
      if (currentMode === 'qrnshort') {
        const shortOutput = document.getElementById('shortUrlOutput');
        const openBtn = document.getElementById('openShortUrlBtn');
        shortOutput.value = '단축 URL 생성 중...';

        let finalShortUrl = '';
        try {
          finalShortUrl = await shortenWithJsonp('https://is.gd/create.php', targetUrl);
        } catch (e1) {
          try {
            finalShortUrl = await shortenWithJsonp('https://v.gd/create.php', targetUrl);
          } catch (e2) {
            // 외부 API 모두 차단된 환경일 경우 100% 이동 보장되는 자체 리다이렉트 링크 생성
            const encoded = btoa(unescape(encodeURIComponent(targetUrl)));
            finalShortUrl = `${window.location.origin}${window.location.pathname}?go=${encoded}`;
          }
        }

        shortOutput.value = finalShortUrl;
        openBtn.href = finalShortUrl;
      }
    }

    function copyShortUrl() {
      const copyText = document.getElementById('shortUrlOutput');
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      alert('단축 URL이 복사되었습니다: ' + copyText.value);
    }
  </script>
</body>
</html>
